{% extends "base.html" %}
{% block title %}Profile — Tayyib{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="text-center mb-8">
        <div id="avatar" class="mx-auto w-20 h-20 bg-[#1C1C1C] rounded-3xl flex items-center justify-center mb-4 text-4xl font-bold">
            ?
        </div>
        <h1 id="username" class="text-3xl font-bold tracking-tight"></h1>
        <p id="email" class="text-[#8A8A8A]"></p>
    </div>
    
    <div class="tayyib-card p-6 mb-6">
        <div class="section-header mb-3">PREFERENCES</div>
        
        <form id="profile-form" class="space-y-5">
            <div>
                <div class="section-header">SCHOOL OF THOUGHT</div>
                <div class="flex bg-[#111111] p-1 rounded-3xl w-fit" id="madhab-picker">
                    <!-- Populated by JS -->
                </div>
            </div>
            
            <div>
                <div class="section-header">COUNTRY (OPTIONAL)</div>
                <input type="text" id="country" class="modern-input w-full" placeholder="e.g. UZ, SA, MY">
            </div>
            
            <button type="submit" class="tayyib-btn w-full mt-2">Save Preferences</button>
        </form>
    </div>
    
    <div class="tayyib-card p-6">
        <div class="section-header mb-3">ACCOUNT</div>
        
        <div class="flex justify-between items-center py-3 border-b border-[#2A2A2A]">
            <div>
                <div class="font-medium">Member since</div>
                <div id="joined" class="text-xs text-[#555]"></div>
            </div>
        </div>
        
        <div class="flex justify-between items-center py-3 border-b border-[#2A2A2A]">
            <div>
                <div class="font-medium">Total scans</div>
            </div>
            <div id="total-scans" class="text-2xl font-bold">0</div>
        </div>
    </div>
</div>

{% block scripts %}
<script>
async function loadProfile() {
    try {
        const profile = await window.TayyibAuth.getProfile();
        const user = window.TayyibAuth.getCurrentUser();
        
        document.getElementById('avatar').innerHTML = (user?.username || 'U')[0].toUpperCase();
        document.getElementById('username').textContent = user?.username || 'User';
        document.getElementById('email').textContent = user?.email || '';
        document.getElementById('country').value = profile.country || '';
        document.getElementById('total-scans').textContent = profile.total_scans || 0;
        
        // Madhab picker
        const madhabPicker = document.getElementById('madhab-picker');
        const madhabs = ['hanafi', 'maliki', 'shafii', 'hanbali'];
        const labels = ['Hanafi', 'Maliki', "Shafi'i", 'Hanbali'];
        
        madhabPicker.innerHTML = madhabs.map((m, i) => `
            <label class="madhab-pill cursor-pointer px-4 py-1.5 text-sm ${profile.madhab === m ? 'madhab-active' : ''}">
                <input type="radio" name="madhab" value="${m}" class="hidden" ${profile.madhab === m ? 'checked' : ''}>
                <span>${labels[i]}</span>
            </label>
        `).join('');
        
    } catch (e) {
        console.error(e);
        alert('Failed to load profile. Please log in again.');
        window.TayyibAuth.clearTokens();
        window.location.href = '/login/';
    }
}

document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const madhab = document.querySelector('input[name="madhab"]:checked').value;
    const country = document.getElementById('country').value;
    
    try {
        await window.TayyibAuth.updateProfile(madhab, country);
        alert('Preferences saved!');
    } catch (err) {
        alert('Failed to save: ' + err.message);
    }
});

document.addEventListener('DOMContentLoaded', loadProfile);
</script>
{% endblock %}
{% endblock %}
